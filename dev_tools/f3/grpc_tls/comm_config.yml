# Synchronous gRPC/TLS comparison profile for a nominal 25 Gbit/s link.
streaming_chunk_size: 1M
streaming_window_size: 64M
streaming_ack_interval: 16M
streaming_retry_max_pending_bytes: 128M

adhoc_conn_scheme: grpc
internal_conn_scheme: grpc
use_aio_grpc: false

grpc:
  max_workers: 100
  options:
    - [grpc.max_send_message_length, 1G]
    - [grpc.max_receive_message_length, 1G]
