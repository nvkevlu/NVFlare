# Opt-in one-port native mTLS tensor-bulk profile. Use the same values on
# every upgraded endpoint. The ordinary F3 control connection and the short-
# lived bulk lanes share one STCP listener; clients initiate every connection.
adhoc_conn_scheme: stcp
internal_conn_scheme: stcp
tcp_verify_hostname: true
tcp_handshake_timeout: 10.0
tcp_no_delay: true

tcp_tensor_bulk_enabled: true
tcp_tensor_bulk_lanes: 3
tcp_tensor_bulk_max_bytes: 32G
tcp_tensor_bulk_max_sessions: 2
tcp_tensor_bulk_timeout: 300.0

# Used by the wire-compatible fallback path and other F3 streams.
streaming_chunk_size: 2M
streaming_window_size: 64M
streaming_ack_interval: 16M
streaming_retry_max_pending_bytes: 128M
streaming_reliable: true
